name: Database operation (reusable)
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      operation:
        required: true
        type: string
      confirmation:
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      DB_PASSWORD:
        required: false
      DB_PASSWORD_BILLING:
        required: false
      DB_PASSWORD_STOCK:
        required: false
      DB_PASSWORD_EXECUTION:
        required: false
permissions:
  contents: read
jobs:
  database:
    if: >-
      (inputs.operation == 'plan' && github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY
    concurrency:
      group: database-${{ inputs.service }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_db_password: ${{ inputs.service == 'core' && secrets.DB_PASSWORD || inputs.service == 'billing' && secrets.DB_PASSWORD_BILLING || inputs.service == 'stock' && secrets.DB_PASSWORD_STOCK || inputs.service == 'execution' && secrets.DB_PASSWORD_EXECUTION || '' }}
      SERVICE: ${{ inputs.service }}
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate operation
        shell: bash
        run: |
          set -euo pipefail
          case "$SERVICE" in core|billing|stock|execution|notification) ;; *) exit 1 ;; esac
          case "$OPERATION" in plan|deploy|destroy) ;; *) exit 1 ;; esac
          [[ "$OPERATION" != destroy || "$CONFIRMATION" == "$SERVICE" ]]
          [[ "$SERVICE" == notification || -n "$TF_VAR_db_password" ]]
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - name: Initialize existing backend
        shell: bash
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "ofisy-tfstate-$TF_VAR_account_id"
          terraform -chdir="$SERVICE" init -input=false -lockfile=readonly             -backend-config="bucket=ofisy-tfstate-$TF_VAR_account_id"             -backend-config="region=us-east-1"
          terraform -chdir="$SERVICE" validate
      - name: Create saved plan
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$OPERATION" == destroy ]]; then args+=(-destroy); fi
          terraform -chdir="$SERVICE" plan -input=false -lock-timeout=5m -no-color "${args[@]}" -out=operation.tfplan
          terraform -chdir="$SERVICE" show -json operation.tfplan > "$SERVICE/plan.json"
          if [[ "$SERVICE" == core && "$OPERATION" != destroy ]]; then
            node scripts/check-core-plan.cjs "$SERVICE/plan.json"
          fi
          echo "### $SERVICE / $OPERATION / $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir="$SERVICE" show -no-color operation.tfplan >> "$GITHUB_STEP_SUMMARY"
      - name: Apply reviewed saved plan
        if: inputs.operation == 'deploy' || inputs.operation == 'destroy'
        shell: bash
        run: terraform -chdir="$SERVICE" apply -input=false -lock-timeout=5m operation.tfplan
      - name: Remove local plan files
        if: always()
        shell: bash
        run: rm -f -- "$SERVICE/operation.tfplan" "$SERVICE/plan.json"
