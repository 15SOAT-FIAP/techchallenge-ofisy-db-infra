name: Destruir Bancos de Dados (Terraform Destroy)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Banco a destruir'
        required: true
        default: all
        type: choice
        options: [all, core, billing, stock, execution, notification]
  workflow_call:
    inputs:
      service:
        type: string
        default: all

jobs:
  terraform-destroy:
    name: Destruir ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.service == 'all' && '["core","billing","stock","execution","notification"]' || format('["{0}"]', inputs.service)) }}

    concurrency:
      group: db-${{ matrix.service }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          repository: 15SOAT-FIAP/techchallenge-ofisy-db-infra

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Destroy
        run: |
          if ! aws s3api head-bucket --bucket "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" 2>/dev/null; then
            echo "Bucket de state não existe, nada a destruir."
            exit 0
          fi

          terraform init \
            -backend-config="bucket=ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=databases/${{ matrix.service }}/terraform.tfstate" \
            -backend-config="region=us-east-1"

          if [ -z "$(terraform state list)" ]; then
            echo "State vazio, nada a destruir."
            exit 0
          fi
          terraform destroy -auto-approve
          echo "### Banco ${{ matrix.service }} destruído com sucesso" >> $GITHUB_STEP_SUMMARY
